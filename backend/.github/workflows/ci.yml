
name: CI/CD

on:
  push:
    branches: [main, backend, frontend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Build, Test and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/EnterpriseContentHub.sln

      - name: Build
        run: dotnet build backend/EnterpriseContentHub.sln -c Release --no-restore

      - name: Test
        run: dotnet test backend/EnterpriseContentHub.sln -c Release --no-build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/apollo87z/enterprise-content-hub-api:latest
            ghcr.io/apollo87z/enterprise-content-hub-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
